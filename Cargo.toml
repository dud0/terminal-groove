[package]
name = "terminal-groove"
version = "1.2.3"
edition = "2024"
rust-version = "1.85"
description = "A real-time terminal groovebox"
license = "MIT"
homepage = "https://github.com/dud0/terminal-groove"
repository = "https://github.com/dud0/terminal-groove"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
cpal = "0.17"
crossterm = "0.29"
dirs = "6"
hound = "3.5"
ratatui = { version = "0.30", features = ["crossterm"] }
rtrb = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
thiserror = "2"
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
